name: Publish npm package

on:
  release:
    types: [published]
  push:
    tags:
      - "builder-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            PACKAGE_DIR="."
            EXPECTED_PREFIX="v"
          else
            PACKAGE_DIR="packages/obsidian"
            EXPECTED_PREFIX="builder-v"
          fi

          VERSION="$(node --print "require('./${PACKAGE_DIR}/package.json').version")"
          PACKAGE_NAME="$(node --print "require('./${PACKAGE_DIR}/package.json').name")"
          EXPECTED_TAG="${EXPECTED_PREFIX}${VERSION}"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $EXPECTED_TAG"
            exit 1
          fi

          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
            *) DIST_TAG="latest" ;;
          esac

          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Confirm version is unpublished
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$PACKAGE_NAME@$VERSION is already published"
            exit 1
          fi

      - name: Publish package
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
        run: npm publish "$PACKAGE_DIR" --access public --tag "$DIST_TAG"
