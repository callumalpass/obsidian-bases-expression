name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/obsidian-bases-expression
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $EXPECTED_TAG"
            exit 1
          fi

          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
            *) DIST_TAG="latest" ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Confirm version is unpublished
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "obsidian-bases-expression@$VERSION" version >/dev/null 2>&1; then
            echo "::error::obsidian-bases-expression@$VERSION is already published"
            exit 1
          fi

      - name: Publish package
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --access public --tag "$DIST_TAG"
