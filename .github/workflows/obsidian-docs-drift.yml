name: Obsidian docs drift

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check upstream Bases docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check upstream docs
        id: docs
        run: node scripts/check-obsidian-docs.mjs

      - name: Upload drift report
        if: steps.docs.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-docs-drift
          path: .tmp/obsidian-docs-drift/

      - name: Open or update review issue
        if: steps.docs.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const title = "Review Obsidian Bases documentation change";
            const labels = ["upstream-docs", "compatibility", "needs-review"];
            const report = fs.readFileSync(".tmp/obsidian-docs-drift/report.md", "utf8");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${report}\n\nWorkflow run: ${runUrl}\n`;

            for (const name of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: name === "upstream-docs" ? "0e8a16" : name === "compatibility" ? "5319e7" : "fbca04",
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                labels,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
            }
